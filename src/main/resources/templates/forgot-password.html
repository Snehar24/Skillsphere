<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere — Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .reset-card { max-width: 460px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-gradient { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; border: none; }
        .btn-gradient:hover { background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%); color: white; }
        .step-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .otp-input { letter-spacing: 8px; font-size: 1.5rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="card reset-card mx-auto p-4 p-md-5">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none d-inline-flex align-items-center mb-3">
                    <i class="bi bi-mortarboard-fill text-primary fs-2 me-2"></i>
                    <span class="fs-4 fw-bold text-dark">SkillSphere</span>
                </a>
                <h4 class="fw-bold mb-1">Account Recovery</h4>
                <p class="text-muted small">Follow the steps below to securely reset your password</p>
            </div>

            <!-- Steps Indicator -->
            <div class="d-flex justify-content-between align-items-center mb-4 position-relative px-3">
                <div class="d-flex flex-column align-items-center">
                    <div id="step1Indicator" class="step-circle bg-primary text-white mb-1">1</div>
                    <span class="small text-muted" style="font-size: 0.75rem;">Email</span>
                </div>
                <div class="flex-grow-1 border-top mx-2" style="margin-top: -16px;"></div>
                <div class="d-flex flex-column align-items-center">
                    <div id="step2Indicator" class="step-circle bg-light text-muted border mb-1">2</div>
                    <span class="small text-muted" style="font-size: 0.75rem;">OTP</span>
                </div>
                <div class="flex-grow-1 border-top mx-2" style="margin-top: -16px;"></div>
                <div class="d-flex flex-column align-items-center">
                    <div id="step3Indicator" class="step-circle bg-light text-muted border mb-1">3</div>
                    <span class="small text-muted" style="font-size: 0.75rem;">New Password</span>
                </div>
            </div>

            <div id="alertBox" class="alert d-none py-2 small" role="alert"></div>

            <!-- STEP 1: Enter Email -->
            <div id="step1">
                <form id="step1Form" onsubmit="handleSendOtp(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="form-text small">We'll send a 6-digit verification code to this address.</div>
                    </div>
                    <button type="submit" id="step1Btn" class="btn btn-gradient w-100 py-2 fw-bold">
                        <i class="bi bi-send me-1"></i>Send Verification Code
                    </button>
                </form>
            </div>

            <!-- STEP 2: Enter OTP -->
            <div id="step2" class="d-none">
                <form id="step2Form" onsubmit="handleVerifyOtp(event)">
                    <div class="mb-3 text-center">
                        <label class="form-label small fw-bold text-muted d-block">Enter 6-Digit Code</label>
                        <input type="text" class="form-control otp-input fw-bold" id="resetOtp" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
                        <div class="form-text small mt-2">Code sent to <span id="displayEmail" class="fw-bold text-dark"></span></div>
                    </div>
                    <button type="submit" id="step2Btn" class="btn btn-gradient w-100 py-2 fw-bold mb-2">
                        <i class="bi bi-shield-check me-1"></i>Verify Code
                    </button>
                    <button type="button" class="btn btn-link btn-sm w-100 text-decoration-none" onclick="resendOtp()">
                        Didn't receive code? Resend
                    </button>
                </form>
            </div>

            <!-- STEP 3: Reset Password -->
            <div id="step3" class="d-none">
                <form id="step3Form" onsubmit="handleResetPassword(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="newPassword" minlength="6" placeholder="At least 6 characters" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock-fill text-muted"></i></span>
                            <input type="password" class="form-control" id="confirmNewPassword" minlength="6" placeholder="Re-enter password" required>
                        </div>
                    </div>
                    <button type="submit" id="step3Btn" class="btn btn-gradient w-100 py-2 fw-bold">
                        <i class="bi bi-check-circle me-1"></i>Reset Password
                    </button>
                </form>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="/login" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let currentOtp = '';

        function showAlert(msg, type = 'danger') {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type} py-2 small`;
            box.innerHTML = msg;
            box.classList.remove('d-none');
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('d-none');
        }

        async function handleSendOtp(e) {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('step1Btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (res.ok) {
                    currentEmail = email;
                    document.getElementById('displayEmail').innerText = email;
                    document.getElementById('step1').classList.add('d-none');
                    document.getElementById('step2').classList.remove('d-none');
                    
                    document.getElementById('step1Indicator').className = 'step-circle bg-success text-white mb-1';
                    document.getElementById('step2Indicator').className = 'step-circle bg-primary text-white mb-1';
                    showAlert(data.message || 'Verification code sent to your email.', 'info');
                } else {
                    showAlert(data.message || 'Unable to process request.');
                }
            } catch(err) {
                showAlert('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-1"></i>Send Verification Code';
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            hideAlert();
            const otp = document.getElementById('resetOtp').value.trim();
            const btn = document.getElementById('step2Btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: otp })
                });
                const data = await res.json();
                if (res.ok && data.valid) {
                    currentOtp = otp;
                    document.getElementById('step2').classList.add('d-none');
                    document.getElementById('step3').classList.remove('d-none');

                    document.getElementById('step2Indicator').className = 'step-circle bg-success text-white mb-1';
                    document.getElementById('step3Indicator').className = 'step-circle bg-primary text-white mb-1';
                    showAlert('Code verified! Please enter your new password.', 'success');
                } else {
                    showAlert(data.message || 'Invalid verification code.');
                }
            } catch(err) {
                showAlert('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-shield-check me-1"></i>Verify Code';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            hideAlert();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;

            if (newPass !== confirmPass) {
                showAlert('Passwords do not match.');
                return;
            }

            const btn = document.getElementById('step3Btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp: currentOtp,
                        newPassword: newPass,
                        confirmNewPassword: confirmPass
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('step3').innerHTML = `
                        <div class="text-center py-4">
                            <i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
                            <h5 class="fw-bold">Password Reset Complete!</h5>
                            <p class="text-muted small">You can now sign in with your new password.</p>
                            <a href="/login" class="btn btn-primary px-4 py-2 mt-2">Go to Login</a>
                        </div>
                    `;
                    document.getElementById('step3Indicator').className = 'step-circle bg-success text-white mb-1';
                    hideAlert();
                } else {
                    showAlert(data.message || 'Password reset failed.');
                }
            } catch(err) {
                showAlert('Network error. Please try again.');
            } finally {
                btn.disabled = false;
            }
        }

        function resendOtp() {
            document.getElementById('step2').classList.add('d-none');
            document.getElementById('step1').classList.remove('d-none');
            document.getElementById('step1Indicator').className = 'step-circle bg-primary text-white mb-1';
            document.getElementById('step2Indicator').className = 'step-circle bg-light text-muted border mb-1';
            hideAlert();
        }
    </script>
</body>
</html>
