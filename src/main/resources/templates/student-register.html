<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: 700;
            color: #4e73df;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h2 class="brand-logo mb-1"><i class="bi bi-globe-americas me-2"></i>SkillSphere</h2>
                        <p class="text-muted">Student Registration Portal</p>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" required placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required placeholder="john.doe@example.com">
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required placeholder="Min 6 characters">
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required placeholder="Confirm Password">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone" required placeholder="+1234567890">
                        </div>
                        <div class="mb-4">
                            <label for="qualification" class="form-label">Highest Qualification</label>
                            <input type="text" class="form-control" id="qualification" placeholder="Bachelor of Engineering">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                            <i class="bi bi-person-plus-fill me-2"></i>Register Now
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0 text-muted">Already have an account? <a href="/login" class="text-decoration-none">Login Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const phone = document.getElementById('phone').value;
        const qualification = document.getElementById('qualification').value;
        const alertContainer = document.getElementById('alertContainer');

        alertContainer.innerHTML = '';

        if (password !== confirmPassword) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    Passwords do not match!
                </div>
            `;
            return;
        }

        try {
            const response = await fetch('/api/auth/register/student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, confirmPassword, phone, qualification })
            });

            if (response.ok) {
                alertContainer.innerHTML = `
                    <div class="alert alert-success" role="alert">
                        Registration successful! Redirecting to login...
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                const err = await response.json();
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        ${err.message || 'Registration failed.'}
                    </div>
                `;
            }
        } catch (error) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    An error occurred. Please try again.
                </div>
            `;
        }
    });
</script>
</body>
</html>
