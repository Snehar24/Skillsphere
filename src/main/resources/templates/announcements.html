<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere — Public Announcements & Broadcasts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .announcement-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }
        .announcement-card:hover { transform: translateY(-3px); }
        .priority-HIGH { border-left: 6px solid #ef4444; }
        .priority-MEDIUM { border-left: 6px solid #f59e0b; }
        .priority-LOW { border-left: 6px solid #3b82f6; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-dark bg-dark py-3" style="background-color: #0f172a !important;">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center text-white" href="/">
                <i class="bi bi-mortarboard-fill text-warning me-2 fs-4"></i>SkillSphere
            </a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-house me-1"></i>Home</a>
                <a href="/login" class="btn btn-warning btn-sm text-dark fw-bold"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold"><i class="bi bi-megaphone-fill text-primary me-2"></i>Platform Broadcasts</h2>
                <p class="text-muted">Official system updates, batch schedules, assessment notices & news</p>
            </div>
            <button onclick="loadAnnouncements()" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted small mt-2">Loading announcements...</p>
        </div>

        <div id="announcementsContainer" class="row g-3 d-none">
            <!-- Dynamic items -->
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
            <i class="bi bi-bell-slash text-muted fs-1 mb-2 d-block"></i>
            <h5 class="text-muted">No active announcements at this time.</h5>
            <p class="text-muted small">All systems and batches are running as scheduled.</p>
        </div>
    </div>

    <script>
        async function loadAnnouncements() {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('announcementsContainer').classList.add('d-none');
            document.getElementById('emptyState').classList.add('d-none');

            try {
                const res = await fetch('/api/announcements/public');
                document.getElementById('loading').classList.add('d-none');

                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('announcementsContainer');
                    container.innerHTML = '';

                    if (!data || data.length === 0) {
                        document.getElementById('emptyState').classList.remove('d-none');
                        return;
                    }

                    data.forEach(a => {
                        const badgeColor = a.priority === 'HIGH' ? 'bg-danger' : (a.priority === 'MEDIUM' ? 'bg-warning text-dark' : 'bg-primary');
                        const card = document.createElement('div');
                        card.className = 'col-12';
                        card.innerHTML = `
                            <div class="card announcement-card priority-${a.priority} p-4">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <span class="badge ${badgeColor} me-2">${a.priority} PRIORITY</span>
                                        <span class="badge bg-secondary">${a.targetRole || 'ALL'}</span>
                                    </div>
                                    <small class="text-muted"><i class="bi bi-clock me-1"></i>${new Date(a.createdAt).toLocaleDateString()} ${new Date(a.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                                </div>
                                <h5 class="fw-bold text-dark mt-2 mb-2">${a.title}</h5>
                                <p class="text-secondary mb-3" style="white-space: pre-line;">${a.message}</p>
                                <div class="d-flex justify-content-between align-items-center text-muted small pt-2 border-top">
                                    <span><i class="bi bi-person-circle me-1"></i>Posted by: ${a.createdByName || 'Administration'}</span>
                                    ${a.expiryDate ? `<span><i class="bi bi-calendar-event me-1"></i>Valid until: ${a.expiryDate}</span>` : ''}
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });

                    container.classList.remove('d-none');
                } else {
                    document.getElementById('emptyState').classList.remove('d-none');
                }
            } catch(err) {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('emptyState').classList.remove('d-none');
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnnouncements);
    </script>
</body>
</html>
