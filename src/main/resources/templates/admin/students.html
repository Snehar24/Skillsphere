<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Manage Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fc; }
        .sidebar {
            min-height: 100vh;
            background-color: #4e73df;
            background-image: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
            background-size: cover;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.8);
            font-weight: 500;
            padding: 12px 20px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar d-none d-md-block px-0">
            <div class="p-3 text-center">
                <h4 class="text-white mb-0"><i class="bi bi-globe-americas me-2"></i>SkillSphere</h4>
                <small class="text-white-50">Admin Panel</small>
            </div>
            <hr class="my-0">
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/students"><i class="bi bi-people me-2"></i>Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/trainers"><i class="bi bi-person-badge me-2"></i>Trainers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/courses"><i class="bi bi-book-half me-2"></i>Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/batches"><i class="bi bi-collection me-2"></i>Batches</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/enrollments"><i class="bi bi-journals me-2"></i>Enrollments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/payments"><i class="bi bi-credit-card me-2"></i>Payments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/reports"><i class="bi bi-graph-up-arrow me-2"></i>Reports</a>
                </li>
                <li class="nav-item mt-4">
                    <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>Logout</a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Manage Students</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="prepareCreateModal()"><i class="bi bi-plus-lg me-2"></i>Add Student</button>
            </div>

            <div class="card shadow mb-4">
                <div class="card-header bg-white py-3">
                    <div class="input-group w-50">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name, email, or registration number...">
                        <button class="btn btn-outline-secondary" type="button" onclick="loadStudents()"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Reg Number</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                            <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between" id="paginationControls">
                        <!-- Dynamic Pagination -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="modal-header">
                    <h5 class="modal-title" id="studentModalLabel">Add Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="studentModalAlert"></div>
                    <div class="mb-3">
                        <label for="studentName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="studentName" required>
                    </div>
                    <div class="mb-3">
                        <label for="studentEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="studentEmail" required>
                    </div>
                    <div class="mb-3" id="passwordFieldContainer">
                        <label for="studentPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="studentPassword" placeholder="Required for new student">
                    </div>
                    <div class="mb-3">
                        <label for="studentPhone" class="form-label">Phone</label>
                        <input type="text" class="form-control" id="studentPhone">
                    </div>
                    <div class="mb-3">
                        <label for="studentQual" class="form-label">Qualification</label>
                        <input type="text" class="form-control" id="studentQual">
                    </div>
                    <div class="mb-3">
                        <label for="studentStatus" class="form-label">Status</label>
                        <select class="form-select" id="studentStatus">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="studentActive" checked>
                        <label class="form-check-label" for="studentActive">User Account Active</label>
                    </div>
                </div>
                <div class="modal-header d-flex justify-content-end gap-2 border-top-0 pt-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 0;
    const studentModal = new bootstrap.Modal(document.getElementById('studentModal'));

    async function loadStudents() {
        const search = document.getElementById('searchInput').value;
        try {
            const res = await fetch(`/api/admin/students?search=${search}&page=${currentPage}&size=10`);
            if (res.ok) {
                const data = await res.json();
                const tbody = document.getElementById('studentsTableBody');
                tbody.innerHTML = '';
                data.content.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${s.name}</td>
                            <td>${s.email}</td>
                            <td>${s.registrationNumber || 'N/A'}</td>
                            <td>${s.phone || 'N/A'}</td>
                            <td><span class="badge bg-${s.active ? 'success' : 'danger'}">${s.status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info me-1" onclick="editStudent(${s.id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteStudent(${s.id})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
                renderPagination(data);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function renderPagination(data) {
        const controls = document.getElementById('paginationControls');
        controls.innerHTML = `
            <span>Showing ${data.numberOfElements} of ${data.totalElements} entries</span>
            <div class="btn-group">
                <button class="btn btn-sm btn-outline-secondary" ${data.first ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Previous</button>
                <button class="btn btn-sm btn-outline-secondary" ${data.last ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>
            </div>
        `;
    }

    function changePage(page) {
        currentPage = page;
        loadStudents();
    }

    function prepareCreateModal() {
        document.getElementById('studentId').value = '';
        document.getElementById('studentForm').reset();
        document.getElementById('studentModalAlert').innerHTML = '';
        document.getElementById('studentModalLabel').innerText = 'Add Student';
        document.getElementById('passwordFieldContainer').style.display = 'block';
        document.getElementById('studentPassword').required = true;
    }

    async function editStudent(id) {
        try {
            const res = await fetch(`/api/admin/students/${id}`);
            if (res.ok) {
                const s = await res.json();
                document.getElementById('studentId').value = s.id;
                document.getElementById('studentName').value = s.name;
                document.getElementById('studentEmail').value = s.email;
                document.getElementById('studentPhone').value = s.phone || '';
                document.getElementById('studentQual').value = s.qualification || '';
                document.getElementById('studentStatus').value = s.status;
                document.getElementById('studentActive').checked = s.active;
                document.getElementById('studentModalAlert').innerHTML = '';
                document.getElementById('passwordFieldContainer').style.display = 'none';
                document.getElementById('studentPassword').required = false;

                document.getElementById('studentModalLabel').innerText = 'Edit Student';
                studentModal.show();
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function deleteStudent(id) {
        if (confirm('Are you sure you want to delete this student?')) {
            try {
                const res = await fetch(`/api/admin/students/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStudents();
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    document.getElementById('studentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertDiv = document.getElementById('studentModalAlert');
        alertDiv.innerHTML = '';

        const id = document.getElementById('studentId').value;
        const name = document.getElementById('studentName').value;
        const email = document.getElementById('studentEmail').value;
        const password = document.getElementById('studentPassword').value;
        const phone = document.getElementById('studentPhone').value;
        const qualification = document.getElementById('studentQual').value;
        const status = document.getElementById('studentStatus').value;
        const active = document.getElementById('studentActive').checked;

        const payload = { name, email, phone, qualification, status, active };
        if (password) payload.password = password;

        try {
            let res;
            if (id) {
                res = await fetch(`/api/admin/students/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch('/api/admin/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            if (res.ok) {
                studentModal.hide();
                loadStudents();
            } else {
                const err = await res.json();
                alertDiv.innerHTML = `<div class="alert alert-danger" role="alert">${err.message || 'Failed to save student.'}</div>`;
            }
        } catch (error) {
            console.error(error);
            alertDiv.innerHTML = `<div class="alert alert-danger" role="alert">An error occurred while saving.</div>`;
        }
    });

    async function logout() {
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            localStorage.clear();
            window.location.href = '/login';
        } catch (e) {
            console.error(e);
        }
    }

    document.addEventListener('DOMContentLoaded', loadStudents);
</script>
</body>
</html>
