<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Admin Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fc; }
        .sidebar { min-height: 100vh; background-image: linear-gradient(180deg, #4e73df 10%, #224abe 100%); color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,.8); font-weight: 500; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: rgba(255,255,255,.1); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar d-none d-md-block px-0">
            <div class="p-3 text-center">
                <h4 class="text-white mb-0"><i class="bi bi-globe-americas me-2"></i>SkillSphere</h4>
                <small class="text-white-50">Admin Panel</small>
            </div><hr class="my-0">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/students"><i class="bi bi-people me-2"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/trainers"><i class="bi bi-person-badge me-2"></i>Trainers</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/courses"><i class="bi bi-book-half me-2"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/batches"><i class="bi bi-collection me-2"></i>Batches</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/enrollments"><i class="bi bi-journals me-2"></i>Enrollments</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/payments"><i class="bi bi-credit-card me-2"></i>Payments</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/reports"><i class="bi bi-graph-up-arrow me-2"></i>Reports</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
            </ul>
        </div>
        <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Notifications</h1>
                <button class="btn btn-primary" onclick="markAllRead()"><i class="bi bi-check2-all me-1"></i>Mark All Read</button>
            </div>
            <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Loading notifications...</p></div>
            <div id="content" style="display:none;">
                <div class="list-group shadow-sm" id="notificationsList"></div>
                <div id="emptyState" class="text-center py-5 text-muted" style="display:none;">
                    <i class="bi bi-bell-slash fs-1 text-secondary"></i><p class="mt-2">No notifications found.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function logout(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).then(()=>{window.location.href='/login'}).catch(()=>{window.location.href='/login'})}
async function load(){
    try {
        const res = await fetch('/api/notifications', {credentials:'include'});
        if (res.status === 401 || res.status === 403) { window.location.href = '/login'; return; }
        const data = await res.json();
        const list = document.getElementById('notificationsList');
        list.innerHTML = '';
        if (!data || data.length === 0) {
            document.getElementById('emptyState').style.display = '';
        } else {
            document.getElementById('emptyState').style.display = 'none';
            data.forEach(n => {
                const readClass = n.read ? 'bg-light text-muted' : 'border-start border-primary border-4';
                const actionBtn = n.read ? '' : `<button class="btn btn-sm btn-outline-primary" onclick="markRead(${n.id})">Mark Read</button>`;
                list.innerHTML += `
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-start p-3 ${readClass}">
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">${n.title||'Notification'}</div>
                        <p class="mb-1">${n.message||''}</p>
                        <small class="text-muted">${new Date(n.createdAt).toLocaleString()}</small>
                    </div>
                    ${actionBtn}
                </div>`;
            });
        }
    } catch(e) { console.error(e); }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
}

async function markRead(id) {
    try {
        const res = await fetch(`/api/notifications/${id}/read`, {method: 'POST', credentials: 'include'});
        if (res.ok) { load(); }
    } catch(e) { console.error(e); }
}

async function markAllRead() {
    try {
        const res = await fetch('/api/notifications/read-all', {method: 'POST', credentials: 'include'});
        if (res.ok) { load(); }
    } catch(e) { console.error(e); }
}

load();
</script>
</body>
</html>
