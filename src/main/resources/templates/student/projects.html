<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fc; }
        .sidebar { min-height: 100vh; background-image: linear-gradient(180deg, #4e73df 10%, #224abe 100%); color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,.8); font-weight: 500; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: rgba(255,255,255,.1); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar d-none d-md-block px-0">
            <div class="p-3 text-center">
                <h4 class="text-white mb-0"><i class="bi bi-globe-americas me-2"></i>SkillSphere</h4>
                <small class="text-white-50">Student Panel</small>
            </div><hr class="my-0">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/student/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/attendance"><i class="bi bi-calendar-check me-2"></i>My Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/assignments"><i class="bi bi-file-earmark-text me-2"></i>Assignments</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/exams"><i class="bi bi-journal-check me-2"></i>Exams</a></li>
                <li class="nav-item"><a class="nav-link active" href="/student/projects"><i class="bi bi-code-square me-2"></i>Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/certificates"><i class="bi bi-journal-bookmark-fill me-2"></i>Certificates</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/payments"><i class="bi bi-credit-card me-2"></i>Payments</a></li>
                <li class="nav-item"><a class="nav-link" href="/announcements"><i class="bi bi-megaphone me-2"></i>Broadcasts</a></li>
                <li class="nav-item"><a class="nav-link" href="/verify-certificate"><i class="bi bi-shield-check me-2"></i>Public Verify</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
            </ul>
        </div>
        <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">My Projects</h1>
            </div>
            <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Loading projects...</p></div>
            <div id="content" style="display:none;">
                <div class="card shadow mb-4">
                    <div class="card-header py-3"><h6 class="m-0 fw-bold text-primary">Projects</h6></div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead><tr><th>Title</th><th>Description</th><th>Deadline</th><th>Total Marks</th><th>Action</th></tr></thead>
                                <tbody id="projectsTable"></tbody>
                            </table>
                        </div>
                        <div id="emptyState" class="text-center py-4 text-muted" style="display:none;">
                            <i class="bi bi-code-slash fs-1"></i><p>No projects found.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Submit Modal -->
<div class="modal fade" id="submitModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Submit Project</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div id="submitAlert" class="alert d-none"></div>
        <input type="hidden" id="submitProjectId">
        <div class="mb-3"><label class="form-label">Repository URL</label><input type="url" class="form-control" id="submitRepoUrl" placeholder="https://github.com/username/repo" required></div>
        <div class="mb-3"><label class="form-label">Documentation / Notes</label><textarea class="form-control" id="submitDocumentation" rows="4" placeholder="Enter details or notes..."></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" onclick="submitProject()">Submit</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function logout(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).then(()=>{window.location.href='/login'}).catch(()=>{window.location.href='/login'})}
function openSubmit(id,title){document.getElementById('submitProjectId').value=id;document.getElementById('submitRepoUrl').value='';document.getElementById('submitDocumentation').value='';document.getElementById('submitAlert').className='alert d-none';document.querySelector('#submitModal .modal-title').textContent='Submit Project: '+title;new bootstrap.Modal(document.getElementById('submitModal')).show()}
async function submitProject(){
    const id=document.getElementById('submitProjectId').value;
    const repositoryUrl=document.getElementById('submitRepoUrl').value;
    const documentation=document.getElementById('submitDocumentation').value;
    if(!repositoryUrl.trim()){document.getElementById('submitAlert').className='alert alert-danger';document.getElementById('submitAlert').textContent='Repository URL is required.';return}
    try{
        const res=await fetch(`/api/student/projects/${id}/submit`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({repositoryUrl,documentation})});
        if(res.ok){bootstrap.Modal.getInstance(document.getElementById('submitModal')).hide();load();alert('Project submitted successfully!')}
        else{const e=await res.json();document.getElementById('submitAlert').className='alert alert-danger';document.getElementById('submitAlert').textContent=e.message||'Submit failed'}
    }catch(e){document.getElementById('submitAlert').className='alert alert-danger';document.getElementById('submitAlert').textContent='Error submitting project'}
}
async function load(){
    try{
        const res=await fetch('/api/student/projects',{credentials:'include'});
        if(res.status===401||res.status===403){window.location.href='/login';return}
        const data=await res.json();
        const tb=document.getElementById('projectsTable');tb.innerHTML='';
        if(!data||data.length===0){document.getElementById('emptyState').style.display=''}
        else{data.forEach(p=>{const row=document.createElement('tr');row.innerHTML=`<td><strong>${p.title||''}</strong></td><td>${p.description||''}</td><td>${p.deadline||'-'}</td><td>${p.totalMarks||'-'}</td><td><button class="btn btn-sm btn-primary" onclick="openSubmit(${p.id},'${(p.title||'').replace(/'/g,"\\'")}')"><i class="bi bi-upload me-1"></i>Submit</button></td>`;tb.appendChild(row)})}
    }catch(e){console.error(e)}
    document.getElementById('loading').style.display='none';document.getElementById('content').style.display='';
}
load();
</script>
</body>
</html>
