<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Payment Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .checkout-container {
            max-width: 800px;
            margin: 50px auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .payment-summary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border-radius: 15px 0 0 15px;
            padding: 40px;
        }
        .payment-form-container {
            padding: 40px;
        }
        @media (max-width: 768px) {
            .payment-summary {
                border-radius: 15px 15px 0 0;
            }
        }
    </style>
</head>
<body>
    <div class="container checkout-container">
        <div class="card overflow-hidden">
            <div class="row g-0">
                <!-- Left Column: Summary -->
                <div class="col-md-5 payment-summary d-flex flex-column justify-content-between">
                    <div>
                        <h4 class="mb-4"><i class="fa-solid fa-graduation-cap me-2"></i>SkillSphere</h4>
                        <p class="text-white-50 small mb-0">Enrollment Checkout Summary</p>
                        <hr class="text-white-50">
                        <div class="mb-3">
                            <span class="text-white-50 small d-block">COURSE</span>
                            <strong class="fs-5" id="courseName">-</strong>
                        </div>
                        <div class="mb-3">
                            <span class="text-white-50 small d-block">STUDENT</span>
                            <span id="studentName">-</span> (<span id="regNumber" class="small">-</span>)
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <span class="text-white-50 small d-block">INSTALLMENT</span>
                                <span id="installmentNum">-</span>
                            </div>
                            <div class="col-6">
                                <span class="text-white-50 small d-block">DUE DATE</span>
                                <span id="dueDate">-</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top border-white-10">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-white-50 small d-block">AMOUNT DUE</span>
                                <strong class="fs-3 text-warning">₹<span id="amountDue">0.00</span></strong>
                            </div>
                            <div>
                                <span class="text-white-50 small d-block">REMAINING</span>
                                <span class="badge bg-light text-dark">₹<span id="remainingAmount">0.00</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Card Checkout Form -->
                <div class="col-md-7 payment-form-container">
                    <h3 class="mb-4">Simulated Payment</h3>
                    <div class="alert alert-info py-2 small" role="alert">
                        <i class="fa-solid fa-circle-info me-2"></i>This is a simulated checkout. Do not enter real credit card details.
                    </div>
                    
                    <form id="paymentForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Cardholder Name</label>
                            <input type="text" class="form-control" id="cardName" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Card Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-credit-card text-muted"></i></span>
                                <input type="text" class="form-control" id="cardNumber" placeholder="4111 2222 3333 4444" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-7">
                                <div class="mb-3">
                                    <label class="form-label small text-muted">Expiration Date</label>
                                    <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY" required>
                                </div>
                            </div>
                            <div class="col-5">
                                <div class="mb-3">
                                    <label class="form-label small text-muted">CVV</label>
                                    <input type="password" class="form-control" id="cardCvv" placeholder="123" maxlength="3" required>
                                </div>
                            </div>
                        </div>

                        <div id="statusMessage" class="mt-2"></div>

                        <div class="d-grid mt-4">
                            <button type="submit" id="payBtn" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-lock me-2"></i>Pay ₹<span id="btnAmount">0.00</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="text-center mt-3 small text-muted">
            <a href="/student/dashboard" class="text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Return to Dashboard</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('paymentId');

        if (!paymentId) {
            alert('Missing payment ID parameter.');
            window.location.href = '/student/dashboard';
        }

        async function loadPaymentDetails() {
            try {
                const res = await fetch(`/api/student/payments/${paymentId}`);
                if (!res.ok) throw new Error('Failed to retrieve checkout record.');
                const data = await res.json();
                
                document.getElementById('courseName').innerText = data.courseName || '';
                document.getElementById('studentName').innerText = data.studentName || '';
                document.getElementById('regNumber').innerText = data.registrationNumber || '';
                document.getElementById('installmentNum').innerText = data.installmentNumber ? `Installment #${data.installmentNumber} of ${data.emiCount||1}` : 'Full Payment';
                document.getElementById('dueDate').innerText = data.dueDate ? new Date(data.dueDate).toLocaleDateString() : 'Immediate';
                document.getElementById('amountDue').innerText = data.amount ? data.amount.toFixed(2) : '0.00';
                document.getElementById('btnAmount').innerText = data.amount ? data.amount.toFixed(2) : '0.00';
                document.getElementById('remainingAmount').innerText = data.remainingAmount ? data.remainingAmount.toFixed(2) : '0.00';
            } catch (err) {
                alert(err.message);
                window.location.href = '/student/dashboard';
            }
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const msg = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Processing...`;
            msg.innerHTML = '';

            try {
                const res = await fetch(`/api/student/payments/${paymentId}/pay-mock`, {
                    method: 'POST'
                });

                if (res.ok) {
                    msg.innerHTML = `<div class="alert alert-success mt-3 small"><i class="fa-solid fa-circle-check me-2"></i>Simulated payment processed successfully! Redirecting...</div>`;
                    setTimeout(() => {
                        window.location.href = '/student/payments';
                    }, 2000);
                } else {
                    throw new Error('Payment processing failed. Please try again.');
                }
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger mt-3 small"><i class="fa-solid fa-circle-xmark me-2"></i>${err.message}</div>`;
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-lock me-2"></i>Pay ₹${document.getElementById('amountDue').innerText}`;
            }
        });

        loadPaymentDetails();
    </script>
</body>
</html>
