<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSphere - Trainer Batches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fc; }
        .sidebar { min-height: 100vh; background-image: linear-gradient(180deg, #1cc88a 10%, #13855c 100%); color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,.8); font-weight: 500; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: rgba(255,255,255,.1); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar d-none d-md-block px-0">
            <div class="p-3 text-center">
                <h4 class="text-white mb-0"><i class="bi bi-globe-americas me-2"></i>SkillSphere</h4>
                <small class="text-white-50">Trainer Panel</small>
            </div><hr class="my-0">
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/trainer/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/trainer/batches"><i class="bi bi-collection me-2"></i>My Batches</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainer/attendance"><i class="bi bi-calendar-check me-2"></i>Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainer/assignments"><i class="bi bi-file-earmark-text me-2"></i>Assignments</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainer/exams"><i class="bi bi-journal-check me-2"></i>Exams</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainer/projects"><i class="bi bi-code-square me-2"></i>Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainer/evaluations"><i class="bi bi-journal-bookmark-fill me-2"></i>Evaluations</a></li>
                <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
            </ul>
        </div>
        <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">My Batches</h1>
            </div>
            <div id="loading" class="text-center py-5"><div class="spinner-border text-success"></div><p class="mt-2">Loading batches...</p></div>
            <div id="content" style="display:none;">
                <div class="row" id="batchesContainer"></div>
                <div id="emptyState" class="text-center py-5 text-muted" style="display:none;">
                    <i class="bi bi-collection fs-1 text-secondary"></i><p class="mt-2">No assigned batches found.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Students Modal -->
<div class="modal fade" id="studentsModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Enrolled Students</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>Student Name</th><th>Email</th><th>Phone</th></tr></thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function logout(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).then(()=>{window.location.href='/login'}).catch(()=>{window.location.href='/login'})}
async function viewStudents(batchId) {
    const tbody = document.getElementById('studentsTableBody');
    tbody.innerHTML = '<tr><td colspan="3" class="text-center"><div class="spinner-border spinner-border-sm text-success"></div> Loading...</td></tr>';
    new bootstrap.Modal(document.getElementById('studentsModal')).show();
    try {
        const res = await fetch(`/api/trainer/batches/${batchId}/students`, {credentials:'include'});
        if (res.ok) {
            const data = await res.json();
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No students enrolled.</td></tr>';
            } else {
                data.forEach(s => {
                    tbody.innerHTML += `<tr><td><strong>${s.name||''}</strong></td><td>${s.email||''}</td><td>${s.phone||'-'}</td></tr>`;
                });
            }
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Error loading students.</td></tr>';
    }
}
async function load(){
    try{
        const res=await fetch('/api/trainer/batches',{credentials:'include'});
        if(res.status===401||res.status===403){window.location.href='/login';return}
        const data=await res.json();
        const cc=document.getElementById('batchesContainer');cc.innerHTML='';
        if(!data||data.length===0){document.getElementById('emptyState').style.display=''}
        else{
            data.forEach(b=>{
                cc.innerHTML += `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card shadow h-100 border-top border-success border-3">
                        <div class="card-body">
                            <h5>${b.batchName||''}</h5>
                            <p class="text-muted mb-1">Course: <strong>${b.courseName||''}</strong></p>
                            <p class="text-muted mb-2"><small>Schedule: ${b.startDate||''} to ${b.endDate||''}</small></p>
                            <button class="btn btn-success btn-sm w-100 mt-2" onclick="viewStudents(${b.id})"><i class="bi bi-people me-1"></i>View Enrolled Students</button>
                        </div>
                    </div>
                </div>`;
            });
        }
    }catch(e){console.error(e)}
    document.getElementById('loading').style.display='none';document.getElementById('content').style.display='';
}
load();
</script>
</body>
</html>
